name: publish

on:
  push:
    tags: ['v*']
  # Para repetir uma publicação que falhou sem ter de mexer na tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing: sem NPM_TOKEN guardado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 traz npm 10, e trusted publishing (OIDC) só existe a partir do
      # 11.5.1 — sem isto o publish falha mesmo com o publisher configurado.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance
